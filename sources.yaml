# Cinco fuentes del enunciado. Para la entrega: dejad exactamente TRES
# activas (comentad o borrad las otras dos) y documentad la elección.

# url fija     → data/raw/{id}.{format}
# url_template → data/raw/{id}_{iso2}.{format}
#   marcadores: {iso2} {iso3}

focus_countries: country_list.csv

sources:
  - id: countries_profile
    name: mledoze/countries (perfil e idiomas)
    url: https://raw.githubusercontent.com/mledoze/countries/master/countries.json
    format: json
    role: profile
    transformer: countries_profile

  - id: worldbank_gdp
    name: World Bank — PIB per cápita (NY.GDP.PCAP.CD)
    url_template: >-
      https://api.worldbank.org/v2/country/{iso2}/indicator/NY.GDP.PCAP.CD?format=json&mrnev=1
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: NY.GDP.PCAP.CD
      indicator_label: GDP per capita (current US$)
      unit: USD

  - id: eurostat_pop
    name: Eurostat — población (demo_pjan)
    url_template: >-
      https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/demo_pjan?format=JSON&lang=en&geo={iso2}&sex=T&age=TOTAL&time=2023
    format: json
    role: indicator
    transformer: eurostat_demo_pjan
    meta:
      indicator_id: demo_pjan
      indicator_label: Population on 1 January
      unit: persons
      time: "2023"

  # --- Fuentes 4 y 5 (descomentad una/ambas solo si sustituís a otras;
  #     en la entrega deben quedar exactamente TRES activas) ---
  - id: owid_life_expectancy
    name: Our World in Data — life expectancy (CSV)
    url: >-
      https://ourworldindata.org/grapher/life-expectancy.csv?v=1&csvType=full&useColumnShortNames=false
    format: csv
    role: indicator
    transformer: owid_life_expectancy
    meta:
      indicator_id: life_expectancy
      indicator_label: Life expectancy
      unit: years
      year: "2023"

  - id: worldbank_pop
    name: World Bank — población total (SP.POP.TOTL)
    url_template: >-
      https://api.worldbank.org/v2/country/{iso2}/indicator/SP.POP.TOTL?format=json&mrnev=1
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: SP.POP.TOTL
      indicator_label: Population, total
      unit: persons

  - id: worldbank_gdp_total
    name: World Bank — PIB total (NY.GDP.MKTP.CD)
    url_template: >-
      https://api.worldbank.org/v2/country/{iso2}/indicator/NY.GDP.MKTP.CD?format=json&mrnev=1
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: NY.GDP.MKTP.CD
      indicator_label: GDP (current US$)
      unit: USD

  - id: worldbank_life_expectancy
    name: World Bank — esperanza de vida (SP.DYN.LE00.IN)
    url_template: >-
      https://api.worldbank.org/v2/country/{iso2}/indicator/SP.DYN.LE00.IN?format=json&mrnev=1
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: SP.DYN.LE00.IN
      indicator_label: Life expectancy at birth, total (years)
      unit: years

  - id: worldbank_urban_population
    name: World Bank — población urbana (SP.URB.TOTL.IN.ZS)
    url_template: >-
      https://api.worldbank.org/v2/country/{iso2}/indicator/SP.URB.TOTL.IN.ZS?format=json&mrnev=1
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: SP.URB.TOTL.IN.ZS
      indicator_label: Urban population (% of total population)
      unit: percent

  - id: worldbank_unemployment
    name: World Bank — desempleo (SL.UEM.TOTL.ZS)
    url_template: >-
      https://api.worldbank.org/v2/country/{iso2}/indicator/SL.UEM.TOTL.ZS?format=json&mrnev=1
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: SL.UEM.TOTL.ZS
      indicator_label: Unemployment, total (% of total labor force)
      unit: percent
